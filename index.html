<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Family Planner</title>
<style>
:root{--bg:#f2f1f3;--paper:#ffffff;--ink:#303036;--muted:#777582;--line:#dddbe2;--soft:#eceaf0;--accent:#8f87a8;--lav:#e5e0ee}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,"Times New Roman",serif}
button,input{font:inherit}.app{max-width:1000px;margin:auto;padding:28px 18px 60px}
header{text-align:center;margin-bottom:24px}h1{font-size:32px;letter-spacing:.08em;margin:0;font-weight:600}header p{margin:7px 0 2px;color:var(--muted);font-style:italic;font-size:15px}.names{font-family:Arial,sans-serif;font-size:11px;letter-spacing:.18em;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:22px}.daybtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:11px 5px;cursor:pointer;color:var(--muted);font-family:Arial,sans-serif}.daybtn strong{display:block;color:var(--ink);font-size:12px}.daybtn span{display:block;font-size:10px;margin-top:5px;line-height:1.25}.daybtn.active{background:var(--accent);color:white}.daybtn.active strong{color:white}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}.panelhead{padding:20px 20px 14px;border-bottom:1px solid var(--line)}h2{margin:0;font-size:22px}.summary{color:var(--muted);font-family:Arial,sans-serif;font-size:12px;margin-top:4px}
.progress{height:6px;background:var(--soft);margin-top:12px;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:var(--accent);transition:.2s}
.event{display:grid;grid-template-columns:115px 1fr 36px;gap:14px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);min-height:62px}.event:last-child{border-bottom:0}.time{font-family:Arial,sans-serif;font-size:11px;color:var(--muted);font-weight:600}.desc{font-size:15px;line-height:1.35}.who{display:block;font-family:Arial,sans-serif;font-size:9px;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}.desc.done{text-decoration:line-through;color:#aaa}input[type=checkbox]{width:19px;height:19px;accent-color:#8f87a8;cursor:pointer}
.section{margin-top:24px}.section h3{font-size:16px;margin:0 0 9px}.routinebox{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 16px}.checkrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-family:Arial,sans-serif;font-size:13px}.checkrow:last-child{border-bottom:0}.checkrow.done{text-decoration:line-through;color:#aaa}
.actions{display:flex;gap:8px;margin-top:16px}.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:9px 12px;cursor:pointer;color:var(--muted);font-family:Arial,sans-serif;font-size:12px}.note{font-family:Arial,sans-serif;color:#999;font-size:11px;margin-top:12px;line-height:1.5}
@media(max-width:650px){.week{grid-template-columns:repeat(4,1fr)}.event{grid-template-columns:78px 1fr 32px;gap:8px;padding:12px 11px}.time{font-size:10px}.desc{font-size:14px}h1{font-size:25px}}
</style>
</head>
<body>
<div class="app">
<header><h1>THE FAMILY PLANNER</h1><p>Our Week, Rhythm &amp; Routines</p><div class="names">RACHEL · SAMUEL · ERIC</div></header>
<div class="week" id="week"></div>
<div class="panel"><div class="panelhead"><h2 id="title"></h2><div class="summary" id="summary"></div><div class="progress"><div class="fill" id="fill"></div></div></div><div id="events"></div></div>
<div class="section" id="routineSection"></div>
<div class="section" id="nightSection"></div>
<div class="actions"><button class="btn" onclick="resetDay()">Reset this day</button></div>
<div class="note">Checkmarks are saved in this browser. The schedule is based directly on your Family Planner; we can keep refining the app as your routine changes.</div>
</div>
<script>
const days=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const summaries={
Sunday:"Church, family lunch & dinner, movie night",
Monday:"Weekday rhythm · check-in & coding, 8pm",
Tuesday:"Weekday rhythm · potential social night",
Wednesday:"Weekday rhythm · potluck 6pm, service 7pm",
Thursday:"Weekday rhythm · Bible study, 8pm",
Friday:"Weekday rhythm · meal plan & laundry, 8pm",
Saturday:"Swim lesson, groceries, family time, bath"
};
const base=[
["Sunday",[
["7:30 AM","FAMILY","Wake up"],["8:40 AM","FAMILY","Leave for church"],["9:00–10:00 AM","FAMILY","Church"],["10:45–11:45 AM","FAMILY","Sunday school / Bible study (potentially)"],["12:00 PM","FAMILY","Eat lunch at home"],["Afternoon","","Do weekly meal prep"],["5:00 PM","FAMILY","Eat dinner at home + family movie night"],["9:30 PM","","Evening routine begins"],["10:00 PM","","In bed"]]],
["Monday",[
["6:00 AM","","Wake up"],["6:15 AM","","Leave for gym · 10-min commute"],["7:00–7:30 AM","","Leave gym · head to work or head home to WFH"],["8:00 AM","","Start work"],["4:00 PM","","Finish work · leave to pick up Eric"],["4:30 PM","","Pick up Eric"],["5:00 PM","","Get home · help finish dinner"],["6:00 PM","FAMILY","Eat dinner together · goal: eat by 6pm"],["8:00 PM","WITH SAMUEL","Do weekly check-in + coding practice"],["9:30 PM","","Evening routine begins"],["10:00 PM","","In bed"]]],
["Tuesday",[
["6:00 AM","","Wake up"],["6:15 AM","","Leave for gym · 10-min commute"],["7:00–7:30 AM","","Leave gym · head to work or head home to WFH"],["8:00 AM","","Start work"],["4:00 PM","","Finish work · leave to pick up Eric"],["4:30 PM","","Pick up Eric"],["5:00 PM","","Get home · help finish dinner"],["6:00 PM","FAMILY","Eat dinner together · goal: eat by 6pm"],["Evening","","Potential hosting or social night"],["9:30 PM","","Evening routine begins"],["10:00 PM","","In bed"]]],
["Wednesday",[
["6:00 AM","","Wake up"],["6:15 AM","","Leave for gym · 10-min commute"],["7:00–7:30 AM","","Leave gym · head to work or head home to WFH"],["8:00 AM","","Start work"],["4:00 PM","","Finish work · leave to pick up Eric"],["4:30 PM","","Pick up Eric"],["5:00 PM","","Get home"],["5:30 PM","FAMILY","Leave for potluck"],["6:00 PM","FAMILY","Potluck dinner"],["7:00 PM","FAMILY","Service"],["9:30 PM","","Evening routine begins"],["10:00 PM","","In bed"]]],
["Thursday",[
["6:00 AM","","Wake up"],["6:15 AM","","Leave for gym · 10-min commute"],["7:00–7:30 AM","","Leave gym · head to work or head home to WFH"],["8:00 AM","","Start work"],["4:00 PM","","Finish work · leave to pick up Eric"],["4:30 PM","","Pick up Eric"],["5:00 PM","","Get home · help finish dinner"],["6:00 PM","FAMILY","Eat dinner together · goal: eat by 6pm"],["8:00 PM","WITH SAMUEL","Bible study"],["9:30 PM","","Evening routine begins"],["10:00 PM","","In bed"]]],
["Friday",[
["6:00 AM","","Wake up"],["6:15 AM","","Leave for gym · 10-min commute"],["7:00–7:30 AM","","Leave gym · head to work or head home to WFH"],["8:00 AM","","Start work"],["4:00 PM","","Finish work · leave to pick up Eric"],["4:30 PM","","Pick up Eric"],["5:00 PM","","Get home · help finish dinner"],["6:00 PM","FAMILY","Eat dinner together · goal: eat by 6pm"],["Evening","","Potential social night"],["8:00 PM","WITH SAMUEL","Plan next week’s meals + start laundry"],["9:30 PM","","Evening routine begins"],["10:00 PM","","In bed"]]],
["Saturday",[
["7:30 AM","FAMILY","Wake up"],["8:40 AM","FAMILY","Leave for swim lesson"],["9:00–9:30 AM","FAMILY","Swim lesson"],["Afternoon","FAMILY","Get groceries + family time / errands & household tasks"],["Evening","FAMILY","Do bath night"],["Evening","WITH SAMUEL","Watch shows together once Eric is in bed"],["Evening","","Finish laundry"]]]
];
const data=Object.fromEntries(base);

const eric=["Teeth","Pajamas","Bedtime story","Song","Prayer","Goodnight · in bed by 8:00 PM"];
const nightRachel=["Pack lunch","Pack work bag: laptop, sweater","Set out gym clothes and shoes","Pack gym bag: work clothes, shoes, toiletries, towel, water bottle, headphones","Queue up gym playlist, podcast, or show"];
let selected=days[new Date().getDay()];
let checks=JSON.parse(localStorage.getItem("familyPlannerChecks")||"{}");
function k(scope,i){return scope+"-"+i}
function renderWeek(){document.getElementById("week").innerHTML=days.map(d=>`<button class="daybtn ${d===selected?"active":""}" onclick="selected='${d}';render()"><strong>${d.slice(0,3).toUpperCase()}</strong><span>${summaries[d]}</span></button>`).join("")}
function render(){
 renderWeek(); document.getElementById("title").textContent=selected.toUpperCase(); document.getElementById("summary").textContent=summaries[selected];
 let ev=data[selected]||[]; document.getElementById("events").innerHTML=ev.map((x,i)=>{let done=!!checks[k(selected,i)];return `<div class="event"><div class="time">${x[0]}</div><div class="desc ${done?"done":""}">${(x[1] && x[1] !== "RACHEL")?`<span class="who">${x[1]}</span>`:""}${x[2]}</div><input type="checkbox" ${done?"checked":""} onchange="toggle('${selected}',${i})"></div>`}).join("");
 let done=ev.filter((_,i)=>checks[k(selected,i)]).length; document.getElementById("summary").textContent=`${summaries[selected]} · ${done} of ${ev.length} checked`;document.getElementById("fill").style.width=(done/(ev.length||1)*100)+"%";
 document.getElementById("routineSection").innerHTML="";
 document.getElementById("nightSection").innerHTML=["Sunday","Monday","Tuesday","Wednesday","Thursday"].includes(selected)?`<h3>NIGHT-BEFORE CHECKLIST · RACHEL</h3><div class="routinebox">${nightRachel.map((x,i)=>checkRow("rachelnight",i,x)).join("")}</div>`:"";
}
function checkRow(scope,i,text){let key=selected+"-"+scope+"-"+i,done=!!checks[key];return `<label class="checkrow ${done?"done":""}"><input type="checkbox" ${done?"checked":""} onchange="checks['${key}']=this.checked;localStorage.setItem('familyPlannerChecks',JSON.stringify(checks));render()">${text}</label>`}
function toggle(d,i){checks[k(d,i)]=!checks[k(d,i)];localStorage.setItem("familyPlannerChecks",JSON.stringify(checks));render()}
function resetDay(){if(confirm("Reset checkmarks for "+selected+"?")){Object.keys(checks).filter(x=>x.startsWith(selected+"-")).forEach(x=>delete checks[x]);localStorage.setItem("familyPlannerChecks",JSON.stringify(checks));render()}}
render();
</script>
</body>
</html>
